<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocal Group Utrecht — close harmony a capella</title>
    <meta
      name="description"
      content="Vocal Group Utrecht is een close harmony a-capellagroep van achttien zangers. Pop in eigen arrangementen — op het podium, op je bruiloft of op je evenement."
    />
    <meta name="robots" content="%VITE_ROBOTS%" />
    <meta name="theme-color" content="#0c0909" />
    <script>
      // Apply the chosen theme before first paint (see src/composables/useTheme.ts).
      ;(function () {
        try {
          var fromUrl = new URLSearchParams(location.search).get('thema')
          var theme = fromUrl || localStorage.getItem('vgu-thema')
          if (theme === 'donker') document.documentElement.dataset.theme = 'dark'
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:site_name" content="Vocal Group Utrecht" />
    <meta property="og:title" content="Vocal Group Utrecht — close harmony a capella" />
    <meta
      property="og:description"
      content="18 stemmen. A capella. One wall of sound."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Vocal Group Utrecht — close harmony a capella uit Utrecht. Zet JavaScript aan om deze site
        te bekijken, of volg ons op
        <a href="https://www.instagram.com/vocalgrouputrecht/" >Instagram</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
